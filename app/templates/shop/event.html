{% extends "base.html" %}
{% block content %}
<div class="card stack" style="max-width:560px">
<div><h1>{{ event.name }}</h1>
<p class="sub">{{ event.starts_at.astimezone(tz).strftime('%d/%m/%Y %H:%M') }} · {{ event.venue }}</p></div>
<p class="price" style="font-size:1.4rem;margin:0">{{ event.price_cents | brl }}</p>
{% if sold_out %}<p id="sold-out">Ingressos esgotados</p>
{% else %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="form" id="buy-form" method="post" action="/events/{{ event.id }}/buy">
  <label>Número do cartão <input name="card_number" inputmode="numeric" autocomplete="cc-number" maxlength="16" placeholder="16 dígitos" required></label>
  <button type="submit">Comprar ingresso</button>
</form>
{% endif %}
</div>{% endblock %}
