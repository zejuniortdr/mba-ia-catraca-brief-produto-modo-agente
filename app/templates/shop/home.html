{% extends "base.html" %}
{% block content %}<h1>Eventos</h1>
<ul>
{% for e in events %}<li data-event-id="{{ e.id }}"><a href="/events/{{ e.id }}">{{ e.name }}</a> — {{ e.starts_at.astimezone(tz).strftime('%d/%m/%Y %H:%M') }} — {{ e.venue }} — {{ e.price_cents | brl }}</li>
{% endfor %}
</ul>{% endblock %}
