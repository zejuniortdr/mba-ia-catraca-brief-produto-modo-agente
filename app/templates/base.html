<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catraca</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
<nav aria-label="Principal">
  <a class="brand" href="/">Catraca</a>
  <a href="/">Vitrine</a>
  {% if user and user.role == 'participant' %}<a href="/me/tickets">Meus ingressos</a>{% endif %}
  {% if user and user.role == 'organizer' %}<a href="/org/events">Área do organizador</a>{% endif %}
  {% if user %}
    <span class="who">{{ user.name }}</span>
    <form class="inline" method="post" action="/logout"><button type="submit">Sair</button></form>
  {% else %}
    <a href="/login">Entrar</a> <a class="btn" href="/signup">Cadastrar</a>
  {% endif %}
</nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
