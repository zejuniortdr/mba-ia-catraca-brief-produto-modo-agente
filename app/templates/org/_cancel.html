{% if event.status == 'published' %}
<p class="sub" style="margin-bottom:.75rem">Irreversível: confirmados viram estornados e pendentes, cancelados.</p>
<form id="cancel-form" method="post" action="/org/events/{{ event.id }}/cancel" onsubmit="return confirm('Cancelar o evento? Não há volta.')"><button class="btn-danger">Cancelar evento</button></form>
{% elif event.status == 'cancelled' %}
{% for m in errors %}<p class="error">{{ m }}</p>{% endfor %}
<p id="event-cancelled">Este evento foi cancelado.</p>
{% else %}
<p class="sub">Disponível depois da publicação.</p>
{% endif %}
