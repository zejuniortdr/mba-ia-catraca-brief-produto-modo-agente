<form class="row" id="checkin-form" method="post" action="/org/events/{{ event.id }}/checkin"><input name="code" aria-label="Código do ingresso" placeholder="Código do ingresso" autocomplete="off" autocapitalize="characters" autofocus> <button type="submit">Check-in</button></form>
{% if checkin_result %}<p {% if checkin_result == 'Entrada liberada' %}data-ok {% endif %}role="status" id="checkin-result">{{ checkin_result }}</p>{% endif %}
