<dl id="panel">
  <div><dt>Confirmados</dt><dd data-metric="confirmed">{{ panel.confirmed }}</dd></div>
  <div><dt>Pendentes</dt><dd data-metric="pending">{{ panel.pending }}</dd></div>
  <div><dt>Check-ins</dt><dd data-metric="checkins">{{ panel.checkins }}</dd></div>
  <div><dt>Vagas disponíveis</dt><dd data-metric="available">{{ panel.available }}</dd></div>
  <div><dt>Receita</dt><dd data-metric="revenue">{{ panel.revenue_cents|brl }}</dd></div>
  <div><dt>Estornados</dt><dd data-metric="refunded">{{ panel.refunded }}</dd></div>
</dl>
