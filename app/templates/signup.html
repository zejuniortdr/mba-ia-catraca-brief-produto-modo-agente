{% extends "base.html" %}
{% block content %}
<div class="auth card stack">
<h1>Cadastrar</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="form" method="post" action="/signup">
  <label>Nome <input type="text" name="name" autocomplete="name" required></label>
  <label>E-mail <input type="email" name="email" autocomplete="email" required></label>
  <label>Senha <input type="password" name="password" autocomplete="new-password" required></label>
  <button type="submit">Cadastrar</button>
</form>
<p class="sub">Já tem conta? <a href="/login">Entrar</a></p>
</div>
{% endblock %}
