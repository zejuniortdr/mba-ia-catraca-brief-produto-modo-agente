services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://catraca:catraca@db:5432/catraca
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-parceiro-2026}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-catraca}
      GATEWAY_DELAY_SCALE: "1.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build: .
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://catraca:catraca@db:5432/catraca
      TEST_DATABASE_URL: postgresql://catraca:catraca@db:5432/catraca_test
      GATEWAY_DELAY_SCALE: "0.01"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ruff check . && pytest -q \"$$@\"", "--"]

volumes:
  pgdata:
